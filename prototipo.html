<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Network CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Special+Elite&display=swap">
<style>
/* Layout: app shell with top bar + tabs; the "Mappa" tab is a cork detective board with red string; detail opens in a side drawer (bottom sheet on phone); voice assistant is a floating mic + sheet. */
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f4f5f7; --ink:#1b2230; --muted:#5b6576; --line:#d6dbe2;
  --accent:#b3261e; --accent-ink:#ffffff; --accent-soft:#f6dedc;
  --board:#c39a6b; --board-2:#b48a5c; --card:#fffdf7; --card-ink:#26221c; --card-muted:#6e6556;
  --ok:#1f7a4d; --warn:#9a5800; --bad:#b3261e; --ok-soft:#dcefe5; --warn-soft:#f6e8d3;
  --shadow:0 1px 2px rgba(20,25,35,.08),0 6px 18px rgba(20,25,35,.08);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-tag:"Special Elite","Courier New",Courier,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151b; --surface:#1a1f28; --surface-2:#212733; --ink:#e6e9ef; --muted:#9aa3b2; --line:#2d3441;
  --accent:#e5594f; --accent-ink:#1a0d0b; --accent-soft:#3a1f1d;
  --board:#3d3126; --board-2:#352a20; --card:#efe8da; --card-ink:#26221c; --card-muted:#6e6556;
  --ok:#5cc08b; --warn:#e3a54a; --bad:#ef6a60; --ok-soft:#1d3329; --warn-soft:#3a2d1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#1a1f28; --surface-2:#212733; --ink:#e6e9ef; --muted:#9aa3b2; --line:#2d3441;
  --accent:#e5594f; --accent-ink:#1a0d0b; --accent-soft:#3a1f1d;
  --board:#3d3126; --board-2:#352a20; --card:#efe8da; --card-ink:#26221c; --card-muted:#6e6556;
  --ok:#5cc08b; --warn:#e3a54a; --bad:#ef6a60; --ok-soft:#1d3329; --warn-soft:#3a2d1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand svg{flex:none}
.brand small{font:400 11px var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--ink);max-width:220px}
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding-block:18px 96px}
.view[hidden]{display:none!important}

/* generic */
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill{font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--accent-soft);color:var(--bad)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
input[type=color]{width:56px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
input[type=text],input[type=search],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.note-demo{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font:500 26px var(--f-mono);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .t{flex:1;min-width:0}
.list .t a,.link{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.list .when{font:12px var(--f-mono);color:var(--muted);white-space:nowrap}

/* map */
#v-mappa{padding:0;overflow:hidden}
.board{position:absolute;inset:0;background:
  radial-gradient(circle at 20% 30%,rgba(0,0,0,.05) 0 1px,transparent 2px) 0 0/7px 7px,
  radial-gradient(circle at 70% 60%,rgba(255,255,255,.06) 0 1px,transparent 2px) 0 0/11px 11px,
  linear-gradient(160deg,var(--board),var(--board-2));touch-action:none}
.board svg{width:100%;height:100%;display:block;cursor:grab}
.board svg.panning{cursor:grabbing}
.edge{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;opacity:.9}
.edge.dim{opacity:.12}
.edge.hot{stroke-width:3.2}
.edge-lbl{font:13px var(--f-tag);fill:var(--card-ink)}
.edge-lbl-bg{fill:var(--card);opacity:.92}
.node{cursor:pointer}
.node .paper{fill:var(--card);stroke:rgba(0,0,0,.18)}
.node .nm{font:15px var(--f-tag);fill:var(--card-ink)}
.node .sub{font:11px var(--f-ui);fill:var(--card-muted)}
.node.dim{opacity:.28}
.node.sel .paper{stroke:var(--accent);stroke-width:2.5}
.node.hit .paper{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.node.linking .paper{stroke:var(--ok);stroke-width:3}
.mapbar{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.mapbar>*{pointer-events:auto}
.mapbar .glass{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:flex;gap:4px;align-items:center;padding:4px}
.mapbar input{width:180px;border:0;background:transparent}
.mapbar .chip{cursor:pointer}
.mapbar .chip[aria-pressed="false"]{opacity:.45}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:38px;height:38px;justify-content:center;padding:0;box-shadow:var(--shadow)}
.maphint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);max-width:min(420px,calc(100% - 110px));box-shadow:var(--shadow)}

/* rubrica */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}

/* deals */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col header b{font-size:13px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.deal .amt{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.deal select{padding:4px 6px;font-size:12px}

/* agenda */
.day{display:flex;flex-direction:column;gap:6px}
.act{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.act.done{opacity:.55}
.act.done .t{text-decoration:line-through}
.act input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.act .t{flex:1;min-width:0}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .hd{display:flex;align-items:flex-start;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.drawer .bd{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.drawer .nm{font:22px var(--f-tag);line-height:1.15}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:640px){.drawer{top:auto;height:78%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding-left:env(safe-area-inset-left,0px)}}

/* modal + voice sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 20px rgba(179,38,30,.35);display:grid;place-items:center}
.fab.rec{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(179,38,30,.15),0 6px 20px rgba(179,38,30,.35)}}
@media (prefers-reduced-motion:reduce){.fab.rec{animation:none;outline:4px solid var(--accent-soft)}}
.voice{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);max-height:82%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.voice .in{width:min(760px,100%);margin:0 auto;padding-block:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.voice textarea{min-height:64px;font-size:15px}
.wave{display:flex;gap:3px;align-items:center;height:18px}
.wave i{width:3px;background:var(--accent);border-radius:2px;height:30%;animation:w 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes w{50%{height:100%}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;height:70%}}
.prop{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.prop input{margin-top:3px;accent-color:var(--accent);width:17px;height:17px;flex:none}
.prop .t{flex:1;min-width:0}
.prop .k{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.answer{border-left:3px solid var(--accent);padding:6px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;white-space:pre-wrap}
.examples{display:flex;gap:6px;flex-wrap:wrap}
.examples button{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;color:var(--muted);text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.who label{display:none}.mapbar input{width:120px}}
</style>

<header class="top gut">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="5" cy="6" r="3" fill="var(--accent)"/><circle cx="21" cy="8" r="3" fill="var(--accent)"/><circle cx="12" cy="21" r="3" fill="var(--accent)"/><path d="M5 6 Q13 9 21 8 M5 6 Q7 15 12 21 M21 8 Q17 15 12 21" stroke="var(--accent)" stroke-width="1.6" fill="none"/></svg>
    <span>Network CRM <small>v1.1 · prototipo</small></span>
  </div>
  <div class="sp"></div>
  <div class="who"><label for="themeSel">Tema</label><select id="themeSel" style="width:auto"><option value="auto">Automatico</option><option value="light">Chiaro</option><option value="dark">Scuro</option></select></div>
  <div class="who"><label for="userSel">Stai usando il CRM come</label><select id="userSel"></select></div>
</header>
<nav class="tabs gut" role="tablist" id="tabs"></nav>
<main>
  <section class="view gut" id="v-panoramica"></section>
  <section class="view" id="v-mappa" hidden>
    <div class="board" id="board"><svg id="svg" aria-label="Mappa delle relazioni"><g id="vp"><g id="gEdges"></g><g id="gNodes"></g></g></svg></div>
    <div class="mapbar">
      <div class="glass"><input type="search" id="mapSearch" placeholder="Cerca sulla lavagna"></div>
      <div class="glass" id="mapFilters"></div>
      <button class="btn" id="btnLink" title="Tocca due schede per collegarle">Collega due persone</button>
      <button class="btn" id="btnNewP">Nuova scheda</button>
    </div>
    <div class="zoom"><button class="btn" id="zIn" aria-label="Ingrandisci">+</button><button class="btn" id="zOut" aria-label="Riduci">−</button><button class="btn" id="zFit" aria-label="Adatta alla schermata"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"/></svg></button></div>
    <div class="maphint" id="mapHint">Trascina le schede per spostarle. Tocca una scheda per vedere i suoi collegamenti.</div>
  </section>
  <section class="view gut" id="v-rubrica" hidden></section>
  <section class="view gut" id="v-trattative" hidden></section>
  <section class="view gut" id="v-agenda" hidden></section>
  <section class="view gut" id="v-permessi" hidden></section>
  <section class="view gut" id="v-registro" hidden></section>
</main>

<aside class="drawer" id="drawer" hidden></aside>

<button class="fab" id="fab" aria-label="Aggiorna il CRM a voce" title="Aggiorna il CRM a voce">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
</button>

<div class="voice" id="voice" hidden>
  <div class="in gut">
    <div class="row" style="justify-content:space-between">
      <div class="row"><h2>Assistente vocale</h2><span id="vState" class="pill neu">pronto</span><span class="wave" id="vWave" hidden><i></i><i></i><i></i><i></i></span></div>
      <button class="btn ghost sm" id="vClose">Chiudi</button>
    </div>
    <label class="f" for="vText">Parla o scrivi cosa vuoi aggiornare
      <textarea id="vText" placeholder="Es. «Ho chiamato Marco Rossi, è interessato al Riva 68. Richiamalo tra 15 giorni»"></textarea>
    </label>
    <div class="row">
      <button class="btn" id="vMic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Parla</span></button>
      <button class="btn pri" id="vGo">Interpreta</button>
      <span class="muted" id="vEngine" style="font-size:12px"></span>
    </div>
    <div class="examples" id="vEx"></div>
    <div id="vOut" class="stack"></div>
  </div>
</div>
<div id="toastHost"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
"use strict";
/* ================= dati ================= */
const KEY = "networkcrm.v1";
const FASI = ["Contatto","Proposta","Trattativa","Vinta","Persa"];
const TIPI_REL = {conoscenza:"Si conoscono",amicizia:"Amicizia",parentela:"Parentela",collaborazione:"Lavorano insieme",presentazione:"Ha presentato",socio:"Soci",cliente:"Cliente di",fornitore:"Fornitore di"};
const TIPI_ATT = {chiamata:"Chiamata",appuntamento:"Appuntamento",promemoria:"Promemoria",nota:"Nota",messaggio:"Messaggio"};
const RUOLI = {admin:"Amministratore",responsabile:"Responsabile",collaboratore:"Collaboratore",lettura:"Sola lettura"};
const VIS = {privato:"Privata (solo tu e l'amministratore)",settore:"Settore (chi lavora negli stessi settori)",tutti:"Tutta l'organizzazione"};

const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const addDays = (n, from) => { const d = from ? new Date(from+"T12:00:00") : new Date(); d.setDate(d.getDate()+n); return iso(d); };
const TODAY = () => iso(new Date());
const uid = p => p + "_" + Math.random().toString(36).slice(2,9);

/* utenti reali del CRM: due amministratori */
const UTENTI = [
  {id:"u_admin", nome:"Loris (tu)", email:"loris4386@gmail.com", ruolo:"admin", settori:["naut","imm","forn","pers"]},
  {id:"u_enrico", nome:"Enrico Bertelli", email:"enrico.berte@gmail.com", ruolo:"admin", settori:["naut","imm","forn","pers"]}
];
function seed(){
  const T = TODAY();
  return {

/* v1/v2 → v3: gli utenti diventano quelli reali (Loris ed Enrico, entrambi amministratori), senza perdere i dati */
function migra(){
  if ((S.versione||1) >= 3) return;
  const m = {u_giulia:"u_enrico", u_paolo:"u_enrico", u_sara:"u_admin", u_loris2:"u_admin"}, f = id => m[id] || id;
  S.persone.forEach(p => { p.creatoDa = f(p.creatoDa); p.condivisiCon = [...new Set((p.condivisiCon||[]).map(f))].filter(x => x!=="u_admin"); });
  S.relazioni.forEach(r => r.creatoDa = f(r.creatoDa));
  S.trattative.forEach(t => t.responsabile = f(t.responsabile));
  S.attivita.forEach(a => a.assegnatoA = f(a.assegnatoA));
  S.registro.forEach(l => l.chi = f(l.chi));
  const altri = (S.utenti||[]).filter(u => !["u_admin","u_enrico","u_loris2","u_giulia","u_paolo","u_sara"].includes(u.id));
  const tutti = S.settori.map(x => x.id);
  S.utenti = [...UTENTI.map(u => ({...u, settori: u.ruolo === "admin" ? [...tutti] : [...u.settori]})), ...altri];
  S.versione = 3; save();
}

}

const NW = 168, NH = 58;
let view = {x:0, y:0, k:1}, fitted = false, SEL = null, LINKING = null, mapHidden = new Set();

function mapPeople(){ return VP().filter(p => !p.settori.length || p.settori.some(s => !mapHidden.has(s))); }
function edgePath(a,b){
  const x1=a.x, y1=a.y, x2=b.x, y2=b.y, mx=(x1+x2)/2, my=(y1+y2)/2, d=Math.hypot(x2-x1,y2-y1);
  return {d:`M${x1},${y1} Q${mx},${my + Math.min(80, d*.14)} ${x2},${y2}`, lx:mx, ly:my + Math.min(80,d*.14)/2};
}
function drawMap(){

      <circle cx="0" cy="${-NH/2}" r="6.5" fill="${col}" stroke="rgba(0,0,0,.35)"/><circle cx="-2" cy="${-NH/2-2}" r="2" fill="rgba(255,255,255,.7)"/>

function applyView(){ $("#vp").setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`); }
function fit(){
  const ps = mapPeople(), svg = $("#svg"), W = svg.clientWidth || 800, H = svg.clientHeight || 600;
  if (!ps.length) return;
  const xs = ps.map(p=>p.x), ys = ps.map(p=>p.y);
  const x0 = Math.min(...xs)-NW, x1 = Math.max(...xs)+NW, y0 = Math.min(...ys)-NH*2, y1 = Math.max(...ys)+NH*2;
  const k = Math.min(1.4, Math.max(.3, Math.min(W/(x1-x0), (H-60)/(y1-y0))));
  view = {k, x: W/2 - (x0+x1)/2*k, y: (H+50)/2 - (y0+y1)/2*k};
  applyView();
}
function zoom(f, cx, cy){
  const svg = $("#svg"); cx ??= svg.clientWidth/2; cy ??= svg.clientHeight/2;
  const k = Math.min(2.5, Math.max(.25, view.k*f)); const r = k/view.k;
  view.x = cx - (cx-view.x)*r; view.y = cy - (cy-view.y)*r; view.k = k; applyView();
}
function setupMap(){
  const svg = $("#svg");
  svg.insertAdjacentHTML("afterbegin", `<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-opacity=".35"/></filter></defs>`);
  let drag = null;
  svg.addEventListener("pointerdown", e => {
    const g = e.target.closest("[data-node]");
    svg.setPointerCapture(e.pointerId);
    drag = {id: g?.dataset.node, sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y, moved:0};
    if (drag.id) { const p = P(drag.id); drag.px = p.x; drag.py = p.y; } else svg.classList.add("panning");
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy; drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    if (drag.id) { if (drag.moved < 4 || !canEdit()) return; const p = P(drag.id); p.x = drag.px + dx/view.k; p.y = drag.py + dy/view.k; drawMap(); }
    else { view.x = drag.vx+dx; view.y = drag.vy+dy; applyView(); }
  });
  svg.addEventListener("pointerup", () => {
    if (!drag) return; svg.classList.remove("panning");
    const d = drag; drag = null;
    if (d.id && d.moved >= 4) { save(); return; }
    if (d.moved >= 4) return;
    if (!d.id) { SEL = null; LINKING = null; drawMap(); return; }
    nodeTap(d.id);
  });
  svg.addEventListener("keydown", e => { const g = e.target.closest("[data-node]"); if (g && (e.key==="Enter"||e.key===" ")) { e.preventDefault(); nodeTap(g.dataset.node); } });
  svg.addEventListener("wheel", e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX-r.left, e.clientY-r.top); }, {passive:false});
  $("#zIn").onclick = () => zoom(1.25); $("#zOut").onclick = () => zoom(1/1.25); $("#zFit").onclick = fit;
  $("#mapSearch").oninput = drawMap;
  $("#btnLink").onclick = () => { if (!guard()) return; LINKING = SEL || "?"; if (LINKING === "?") toast("Tocca la prima scheda, poi la seconda."); drawMap(); };
  $("#btnNewP").onclick = () => formPerson();
  $("#mapFilters").onclick = e => { const b = e.target.closest("[data-mf]"); if (!b) return; const id = b.dataset.mf; mapHidden.has(id) ? mapHidden.delete(id) : mapHidden.add(id); rMap(); };
}
function nodeTap(id){
  if (LINKING === "?") { LINKING = id; drawMap(); return; }
  if (LINKING && LINKING !== id) { const a = LINKING; LINKING = null; formRelation(a, id); return; }
  SEL = SEL === id ? null : id; drawMap(); if (SEL) openDrawer(id);
}

    else if (f.type === "checks") inp = `<div class="row" id="${id}">${f.options.map(([v,l]) => `<label style="display:inline-flex;gap:5px;align-items:center;color:var(--ink);font-weight:400"><input type="checkbox" value="${esc(v)}" ${(f.value||[]).includes(v)?"checked":""}>${esc(l)}</label>`).join("")}</div>`;
    else if (f.type === "textarea") inp = `<textarea id="${id}" rows="3">${esc(f.value||"")}</textarea>`;
    else inp = `<input id="${id}" type="${f.type||"text"}" value="${esc(f.value??"")}" ${f.required?"required":""}>`;
    return `<label class="f ${full}" for="${id}">${esc(f.label)}${inp}</label>`;
  }).join("")}</div><p class="muted" id="formErr" style="margin:0"></p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Annulla</button><button class="btn pri">${esc(submitLabel)}</button></div></form>`;
  document.body.append(sc);
  const close = () => sc.remove();
  sc.querySelector("[data-x]").onclick = close;
  sc.addEventListener("click", e => { if (e.target === sc) close(); });
  sc.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  sc.querySelector("form").addEventListener("submit", e => {
    e.preventDefault();
    const v = {};
    fields.forEach(f => { const el = sc.querySelector("#f_"+f.id); v[f.id] = f.type === "checks" ? [...el.querySelectorAll("input:checked")].map(i=>i.value) : el.value.trim(); });
    const miss = fields.find(f => f.required && !v[f.id]);
    if (miss) { sc.querySelector("#formErr").textContent = `Compila il campo «${miss.label}».`; return; }
    const err = onSubmit(v); if (err) { sc.querySelector("#formErr").textContent = err; return; }
    close(); save(); render();
  });
  sc.querySelector("input,select,textarea")?.focus();
}

/* ================= linguaggio naturale ================= */
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g," ").replace(/\s+/g," ").trim();
const NUM = {un:1,uno:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10,undici:11,dodici:12,quindici:15,venti:20,trenta:30};
const toNum = w => /^\d+$/.test(w) ? +w : NUM[w];
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GIORNI = ["domenica","lunedi","martedi","mercoledi","giovedi","venerdi","sabato"];

function parseWhen(t){
  let date = null, ora = "";
  const n = norm(t);
  let m;
  if (/\bdopodomani\b/.test(n)) date = addDays(2);
  else if (/\bdomani\b/.test(n)) date = addDays(1);
  else if (/\boggi\b|\bstasera\b|\bstamattina\b/.test(n)) date = TODAY();
  if (!date && (m = n.match(/\btra (\d+|un|uno|una|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|undici|dodici|quindici|venti|trenta) (giorn[oi]|settiman[ae]|mes[ei])\b/))) {
    const k = toNum(m[1]); const u = m[2][0];
    if (u === "g") date = addDays(k);
    else if (u === "s") date = addDays(k*7);
    else { const d = new Date(); d.setMonth(d.getMonth()+k); date = iso(d); }
  }
  if (!date && /\btra una settimana\b|\bsettimana prossima\b/.test(n)) date = addDays(7);
  if (!date && (m = n.match(/\b(\d{1,2})(?: |\/|-)(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre|\d{1,2})(?:(?: |\/|-)(\d{4}))?\b/))) {
    const day = +m[1], mon = /\d/.test(m[2]) ? +m[2]-1 : MESI.indexOf(m[2]);
    if (day >= 1 && day <= 31 && mon >= 0 && mon <= 11) {
      const now = new Date(); let y = m[3] ? +m[3] : now.getFullYear();
      let d = new Date(y, mon, day, 12); if (!m[3] && iso(d) < TODAY()) d = new Date(y+1, mon, day, 12);
      date = iso(d);
    }
  }
  if (!date && (m = n.match(/\b(lunedi|martedi|mercoledi|giovedi|venerdi|sabato|domenica)\b/))) {
    const target = GIORNI.indexOf(m[1]), d = new Date(); let diff = (target - d.getDay() + 7) % 7; if (diff === 0) diff = 7; date = addDays(diff);
  }
  if ((m = n.match(/\b(?:alle|ore|per le|verso le)(?: ore)? (\d{1,2})(?:[:.](\d{2})| e (mezza|mezzo|un quarto|quarto))?\b/))) {
    let h = +m[1], mi = m[2] ? +m[2] : m[3] ? (m[3].includes("quarto") ? 15 : 30) : 0;
    if (h < 12 && /pomeriggio|sera\b|stasera/.test(n) && h <= 11) h += 12;
    else if (h >= 1 && h <= 7 && !/mattin/.test(n)) h += 12;
    if (h <= 23 && mi <= 59) ora = String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");
  } else if (/\bmezzogiorno\b/.test(n)) ora = "12:00";
  return {date, ora};
}
function parseAmount(t){
  const n = norm(t).replace(/(\d)\.(\d{3})/g,"$1$2");
  let m = n.match(/(\d+(?:[.,]\d+)?)\s*(milioni|milione|mln|mila|k|euro|€)/);
  if (m) { let v = parseFloat(m[1].replace(",",".")); if (/^mil(ion|n)/.test(m[2])) v *= 1e6; else if (m[2]==="mila"||m[2]==="k") v *= 1e3; return Math.round(v); }
  m = n.match(/\b(un|uno|due|tre|quattro|cinque|sei|sette|otto|nove|dieci)\s+(milioni|milione|mila)\b/);
  if (m) return toNum(m[1]) * (m[2]==="mila" ? 1e3 : 1e6);
  return null;
}
/* persone citate nel testo: nome completo, cognome o nome di battesimo se univoci */
function mentions(text, pool = VP()){
  const n = " " + norm(text).replace(/[^a-z0-9 ]/g," ") + " ";
  const hits = [];
  for (const p of pool) {
    const full = norm(p.nome).replace(/[^a-z0-9 ]/g," ");
    let i = n.indexOf(" "+full+" ");
    if (i >= 0) { hits.push({p, i, len:full.length}); continue; }
    const parts = full.split(" ").filter(w => w.length > 2);
    for (const w of parts) {
      const same = pool.filter(q => norm(q.nome).split(" ").includes(w)).length;
      const j = n.indexOf(" "+w+" ");
      if (same === 1 && j >= 0) { hits.push({p, i:j, len:w.length}); break; }
    }
  }
  hits.sort((a,b) => a.i - b.i || b.len - a.len);
  const out = []; for (const h of hits) if (!out.some(o => o.p === h.p || (h.i >= o.i && h.i < o.i + o.len))) out.push(h);
  return out.map(h => h.p);
}
/* nomi propri scritti con l'iniziale maiuscola che non sono ancora nel CRM */
function newNames(text){
  const known = VP().map(p => norm(p.nome));
  const stop = new Set(["Ho","Ha","Il","La","Lo","Le","Gli","Un","Una","Nuovo","Nuova","Aggiungi","Crea","Inserisci","Collega","Ricordami","Richiama","Chiama","Domani","Oggi","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica","Nota","Appuntamento","Promemoria","Trattativa","Sposta","Segna","Chi","Cosa","E","Poi","Per","Con","Settore","Nautica","Immobiliare","Fornitori","Personale","Mi","Ci","Si","Al","Del","Della","Nel","Nella","Riva","Milano","Genova","Roma","Como","Monza","Torino"]);
  const words = text.replace(/[.,;:!?«»"()]/g," ").split(/\s+/).filter(Boolean);
  const out = []; let cur = [];
  const flush = () => { if (cur.length >= 2) { const nm = cur.join(" "); if (!known.includes(norm(nm)) && !mentions(nm).length) out.push(nm); } cur = []; };
  words.forEach((w,i) => { if (/^[A-ZÀ-Ý][a-zà-ÿ'’]+$/.test(w) && !(stop.has(w) && !cur.length)) cur.push(w); else flush(); if (cur.length === 3) flush(); });
  flush();
  return out;
}
function relType(n){
  if (/presentat|presentato|presentata/.test(n)) return "presentazione";
  if (/\bamic[oiae]\b|\bamiche\b|\bamici\b|amicizia/.test(n)) return "amicizia";
  if (/fratell|sorell|cugin|moglie|marito|figli|padre|madre|parent|zio|zia|cognat/.test(n)) return "parentela";
  if (/\bsoci[oa]?\b/.test(n)) return "socio";
  if (/fornitor|fornisce/.test(n)) return "fornitore";
  if (/cliente di|e cliente/.test(n)) return "cliente";
  if (/lavora(no)? (con|insieme|per)|collabora|colleg[hi]i? di lavoro|collega di|stesso ufficio/.test(n)) return "collaborazione";
  return "conoscenza";
}

/* interprete locale: funziona offline, senza AI */
function localInterpret(text){
  const azioni = []; let risposta = "";
  const frasi = text.split(/(?<=[.!?;])\s+|\s*,?\s+(?:e poi|poi)\s+/i).map(s=>s.trim()).filter(Boolean);
  let ctx = null;
  for (const f of frasi) {
    const n = norm(f), who = mentions(f), when = parseWhen(f);
    if (!who.length && ctx && /\b(richiamal[oa]|chiamal[oa]|sentil[oa]|ricontattal[oa]|mandagli|mandale|scrivigli|scrivile|incontral[oa]|vederl[oa]|gli|le|lui|lei)\b/.test(n)) who.push(ctx);
    if (who.length) ctx = who[0];
    let m;
    /* domande */
    if ((m = n.match(/chi non (?:sento|contatto|chiamo|vedo|sentiamo|ho sentito)(?: piu)? da (?:almeno |oltre |piu di )?(\d+|un|uno|una|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|dodici) (giorn[oi]|settiman[ae]|mes[ei])/))) {
      const k = toNum(m[1]), g = m[2][0]==="g" ? k : m[2][0]==="s" ? k*7 : k*30;
      const l = VP().filter(p => daysSince(p.ultimoContatto) >= g).sort((a,b)=>daysSince(b.ultimoContatto)-daysSince(a.ultimoContatto));
      risposta += (l.length ? `Non senti da almeno ${g} giorni:\n` + l.map(p => `• ${p.nome} (${daysSince(p.ultimoContatto)} giorni)`).join("\n") : `Hai sentito tutti negli ultimi ${g} giorni.`) + "\n"; continue;
    }
    if (/^(chi|quali|quante|quanti|mostra|elenca|fammi vedere|cerca)\b/.test(n) && !/ricord/.test(n)) {
      if (who.length && /conosce|collegat|collegament|rete di|amici di|tramite/.test(n)) {
        const p = who[0], rs = VR().filter(r => r.da===p.id || r.a===p.id);
        let l = rs.map(r => ({o:P(r.da===p.id?r.a:r.da), r}));
        const st = findSettore(n.replace(norm(p.nome),"")); if (st) l = l.filter(x => x.o.settori.includes(st.id));
        risposta += (l.length ? `${p.nome} è collegato a:\n` + l.map(x => `• ${x.o.nome} · ${TIPI_REL[x.r.tipo]}${x.o.ruolo?" · "+x.o.ruolo:""}`).join("\n") : `Non vedo collegamenti di ${p.nome}${st?" nel settore "+st.nome:""}.`) + "\n"; continue;
      }
      if (/trattativ|affari|opportunit/.test(n)) {
        const l = VT().filter(t => !["Vinta","Persa"].includes(t.fase));
        risposta += (l.length ? "Trattative aperte:\n" + l.map(t => `• ${t.titolo} · ${t.fase} · ${eur(t.importo)}`).join("\n") : "Non ci sono trattative aperte.") + "\n"; continue;
      }
      const st = findSettore(n), cm = f.match(/\b(?:a|di|in)\s+([A-ZÀ-Ý][a-zà-ÿ]+)\s*[?.!]?$/);
      let l = VP(); if (st) l = l.filter(p => p.settori.includes(st.id)); if (cm) l = l.filter(p => norm(p.citta) === norm(cm[1]));
      if (st || cm) { risposta += (l.length ? `Contatti${st?" nel settore "+st.nome:""}${cm?" a "+cm[1]:""}:\n` + l.map(p => `• ${p.nome} · ${p.ruolo}${p.citta?" · "+p.citta:""}`).join("\n") : "Non trovo nessuno con questi criteri.") + "\n"; continue; }
    }
    if (/cosa (devo fare|ho da fare|ho in agenda|c e in agenda)|impegni|agenda di/.test(n)) {
      const d = when.date || TODAY(), l = VA().filter(a => a.data === d && !a.fatto && a.tipo !== "nota");
      risposta += (l.length ? `In agenda per ${fmtD(d)}:\n` + l.map(a => `• ${a.ora?a.ora+" ":""}${a.testo}`).join("\n") : `Niente in agenda per ${fmtD(d)}.`) + "\n"; continue;
    }
    /* nuovo contatto */
    if ((m = f.match(/^(?:aggiungi|crea|inserisci|registra|salva)?\s*(?:un |una |il |la )?(?:nuov[oa] )?(contatto|persona|cliente|azienda|fornitore|societ[aà])\s+(.+)$/i)) && /aggiung|crea|inserisc|nuov|registra|salva/i.test(f)) {
      const rest = m[2];
      const nm = (rest.match(/^((?:[A-ZÀ-Ý][\wà-ÿ'’]*\s?){1,4})/) || [,rest.split(/[,]| che | del | della | di | a /)[0]])[1].trim();
      const tel = f.match(/(\+?\d[\d\s]{6,}\d)/), mail = f.match(/[\w.+-]+@[\w-]+\.[\w.]+/);
      const cit = f.match(/\b(?:di|a|vive a|abita a|da)\s+([A-ZÀ-Ý][a-zà-ÿ]+)(?=[\s,.]|$)/g);
      const citta = cit ? cit.map(c => c.replace(/^\S+(?:\s+a)?\s+/,"")).find(c => !nm.includes(c)) : "";
      const ruolo = (n.match(/\b(?:e|fa (?:il|la|l)?|di professione|lavora come)\s+(?:un |una |il |la )?(architett[oa]|notaio|avvocat[oa]|commercialista|broker|armatore|agente|ingegnere|geometra|medico|imprenditor[ea]|skipper|capitano|costruttore|banchier[ea]|consulente)/) || [])[1] || "";
      const st = findSettore(n);
      azioni.push({tipo:"crea_persona", nome:nm, ruolo: ruolo ? ruolo[0].toUpperCase()+ruolo.slice(1) : "", tipoScheda: /azienda|fornitore|societ/.test(m[1].toLowerCase()) ? "azienda" : "persona", settori: st ? [st.id] : [], telefono: tel ? tel[1].replace(/\s+/g," ") : "", email: mail ? mail[0] : "", citta: citta || ""});
      for (const o of who) if (/conosce|amic|presentat|lavora con|collega|fratell|sorell|soci/.test(n)) azioni.push({tipo:"crea_relazione", da:nm, a:o.id, relazione:relType(n)});
      continue;
    }
    /* trattative */
    if (/trattativ|opportunit|affare/.test(n)) {
      const fase = /\bvint[ao]\b|chius[ao] positiv|firmat|vendut[ao]|\bacquisit[ao]\b/.test(n) ? "Vinta" : /\bpers[ao]\b|saltat[ao]|rinunci/.test(n) ? "Persa" : (n.match(/\b(?:in|a|alla|fase|nella fase) (contatto|proposta|trattativa)\b/)||[])[1]?.replace(/^./, c => c.toUpperCase()) || null;
      const tr = VT().find(t => norm(f).includes(norm(t.titolo)) || (who[0] && t.personaId === who[0].id));
      if (/^(nuova|crea|apri|aggiungi|inserisci)|nuova (trattativa|opportunita)/.test(n) || !tr) {
        let tit = (f.match(/(?:trattativa|opportunità|opportunita|affare)\s+(?:per\s+)?(?:la |il |lo |l')?(.+?)(?=\s+con\s|\s+(?:da|di|per)\s+(?:\d|un|uno|due|tre|quattro|cinque|dieci)\b|,|\.|$)/i) || [])[1] || "Nuova trattativa";
        tit = tit.trim(); tit = tit[0].toUpperCase() + tit.slice(1);
        const st = findSettore(n);
        azioni.push({tipo:"crea_trattativa", titolo: tit, persona: who[0]?.id || null, settore: st?.id || me().settori[0], importo: parseAmount(f) || 0, fase: fase && fase !== "Vinta" && fase !== "Persa" ? fase : "Contatto", scadenza: when.date});
      } else azioni.push({tipo:"aggiorna_trattativa", trattativa: tr.id, fase: fase || tr.fase, importo: parseAmount(f)});
      continue;
    }
    /* collegamenti */
    const nuovi = newNames(f);
    if (/^collega|\bconosce\b|\bsi conoscono\b|presentat|\bamic[oiae] (di|con)\b|\blavora(no)? con\b|\bcollabora\b|fratello|sorella|cugin|moglie|marito|\bsoci[oa]?\b|fornitore di|cliente di/.test(n) && who.length + nuovi.length >= 2 && !/ho (chiamato|sentito)/.test(n)) {
      const ppl = [...who.map(p=>p.id), ...nuovi];
      nuovi.forEach(nm => azioni.push({tipo:"crea_persona", nome:nm, settori:[], tipoScheda:"persona"}));
      let [da, a] = ppl;
      if (/(e stat[oa]|e stata) presentat[oa] da|presentat[oa] da/.test(n)) [da, a] = [a, da];
      const nota = f.match(/[:—–-]\s*(.+)$/);
      azioni.push({tipo:"crea_relazione", da, a, relazione: relType(n), nota: nota ? nota[1] : ""});
      continue;
    }
    /* contatto avvenuto */
    if (/\bho (chiamato|sentito|telefonato|visto|incontrato|parlato|scritto|mandato)\b|\bmi ha (chiamato|scritto|telefonato)\b|\bsono stato da\b|\bincontrato\b/.test(n) && who.length) {
      const canale = /scritto|mandato|messaggio|whatsapp|mail/.test(n) ? "messaggio" : /visto|incontrato|stato da/.test(n) ? "appuntamento" : "chiamata";
      const nota = f.replace(/^.*?\b(?:chiamato|sentito|telefonato|visto|incontrato|parlato con|scritto a|scritto)\s+(?:a\s+|con\s+)?/i,"").replace(new RegExp("^"+who[0].nome.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*[,:.]?\\s*","i"),"").replace(/\b(richiamal[oa]|ricontattal[oa]|ricordami)\b.*$/i,"").trim().replace(/[,.]$/,"");
      azioni.push({tipo:"registra_contatto", persona: who[0].id, canale, testo: nota || (canale==="chiamata"?"Telefonata":"Contatto")});
      if (/\b(richiama|richiamal|ricontatt|risentir|ricordami|sentirci|risentirci|ci sentiamo)/.test(n) && when.date) azioni.push({tipo:"crea_attivita", persona: who[0].id, attivita: "chiamata", data: when.date, ora: when.ora, testo: `Richiamare ${who[0].nome}`});
      continue;
    }
    /* note */
    if ((m = f.match(/^(?:aggiungi (?:una )?)?(?:nota|annota|appunto|scrivi)(?: per| su| a| di)?\s+(.+)$/i)) && who.length) {
      const body = (f.split(/[:]/)[1] || m[1].replace(new RegExp(who[0].nome.split(" ").join("|"),"gi"),"")).trim().replace(/^(che|:)\s*/,"");
      azioni.push({tipo:"aggiungi_nota", persona: who[0].id, testo: body || f}); continue;
    }
    /* aggiornamento dati */
    if ((m = n.match(/\b(telefono|numero|cellulare|email|mail|citta|ruolo|azienda)\b.*\b(?:e|diventa|nuovo|nuova)\b/)) && who.length) {
      const campo = {telefono:"telefono",numero:"telefono",cellulare:"telefono",email:"email",mail:"email",citta:"citta",ruolo:"ruolo",azienda:"azienda"}[m[1]];
      let val = "";
      if (campo === "telefono") val = (f.match(/(\+?\d[\d\s]{6,}\d)/)||[])[1]; else if (campo === "email") val = (f.match(/[\w.+-]+@[\w-]+\.[\w.]+/)||[])[0];
      else val = (f.match(/\b(?:è|e|diventa)\s+(.+)$/i)||[])[1];
      if (val) { azioni.push({tipo:"aggiorna_persona", persona: who[0].id, campi:{[campo]: val.trim().replace(/[.]$/,"")}}); continue; }
    }
    /* attività future */
    if (/ricordami|promemoria|richiam|chiamar|telefonar|appuntament|incontr|riunion|vedere|vedo|sentire|mandare|inviare|scrivere|preparare|fissa/.test(n) && (when.date || /ricordami|promemoria/.test(n))) {
      const tipo = /appuntament|incontr|riunion|vedere|vedo|sopralluog|cena|pranzo|caffe/.test(n) ? "appuntamento" : /richiam|chiamar|telefonar|sentire/.test(n) ? "chiamata" : "promemoria";
      let testo = f.replace(/^(ricordami di|ricordami che|ricordami|promemoria:?|metti (un )?promemoria( per)?|fissa (un )?)/i,"").trim();
      testo = testo.replace(/(^|\s)(oggi|domani|dopodomani|stasera|tra \S+ (?:giorni|giorno|settimane|settimana|mesi|mese)|(?:lunedì|martedì|mercoledì|giovedì|venerdì|sabato|domenica|lunedi|martedi|mercoledi|giovedi|venerdi)(?: prossimo)?|il \d{1,2}(?: (?:gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre))?|alle(?: ore)? \d{1,2}(?:[:.]\d{2})?(?: e mezza)?|del pomeriggio|di mattina|di sera)(?=[\s,.!?]|$)/gi,"$1").replace(/\s{2,}/g," ").replace(/[,.\s]+$/,"").trim();
      if (who[0] && /^(richiamal[oa]|chiamal[oa]|sentil[oa]|ricontattal[oa])\b/i.test(testo)) testo = `Richiamare ${who[0].nome}`;
      azioni.push({tipo:"crea_attivita", persona: who[0]?.id || null, attivita: tipo, data: when.date || addDays(1), ora: when.ora, testo: testo ? testo[0].toUpperCase()+testo.slice(1) : TIPI_ATT[tipo]});
      continue;
    }
    if (who.length && f.length > 12) { azioni.push({tipo:"aggiungi_nota", persona: who[0].id, testo: f}); continue; }
    risposta += `Non ho capito «${f}». Prova con una delle frasi di esempio.\n`;
  }
  return {azioni, risposta: risposta.trim()};
}

/* interprete AI (Claude, se la pagina è aperta su claude.ai) */
let SAMPLE = null;
function aiPrompt(text){
  const u = me();
  const data = {
    oggi: TODAY(), giorno: new Date().toLocaleDateString("it-IT",{weekday:"long"}), utente: {id:u.id, nome:u.nome, ruolo:u.ruolo, settori:u.settori},
    settori: S.settori.map(s=>({id:s.id, nome:s.nome})), utenti: S.utenti.map(x=>({id:x.id, nome:x.nome})), fasi: FASI, tipi_relazione: Object.keys(TIPI_REL),
    persone: VP().map(p=>({id:p.id, nome:p.nome, tipo:p.tipo, ruolo:p.ruolo, azienda:p.azienda, settori:p.settori, citta:p.citta, ultimoContatto:p.ultimoContatto, tag:p.tag})),
    relazioni: VR().map(r=>({da:r.da, a:r.a, tipo:r.tipo, nota:r.nota})),
    trattative: VT().map(t=>({id:t.id, titolo:t.titolo, persona:t.personaId, settore:t.settore, fase:t.fase, importo:t.importo, scadenza:t.scadenza})),
    attivita: VA().filter(a=>a.data >= addDays(-30)).map(a=>({persona:a.personaId, tipo:a.tipo, data:a.data, ora:a.ora, testo:a.testo, fatto:a.fatto}))
  };
  return `Sei l'assistente di un CRM italiano basato sulle relazioni tra persone. L'utente ha dettato a voce il messaggio qui sotto: può contenere errori di trascrizione nei nomi. Trasformalo in azioni sul CRM oppure rispondi alle domande usando SOLO i dati forniti.

DATI (JSON): ${JSON.stringify(data)}

MESSAGGIO DELL'UTENTE: """${text}"""

Rispondi SOLO con un oggetto JSON, senza testo prima o dopo, con questa forma:
{"azioni":[...], "risposta":"testo per l'utente, vuoto se ci sono solo azioni"}
Azioni ammesse (per "persona", "da", "a" usa l'id esistente; per una persona nuova creata nello stesso messaggio usa il suo nome esatto):
{"tipo":"crea_persona","nome":"","tipoScheda":"persona|azienda","ruolo":"","azienda":"","settori":["id settore"],"telefono":"","email":"","citta":""}
{"tipo":"aggiorna_persona","persona":"id","campi":{"telefono|email|citta|ruolo|azienda":"valore"}}
{"tipo":"crea_relazione","da":"id o nome","a":"id o nome","relazione":"uno dei tipi_relazione","nota":""}  (per "presentazione": "da" è chi ha presentato)
{"tipo":"registra_contatto","persona":"id","canale":"chiamata|appuntamento|messaggio","testo":"riassunto di cosa ci si è detti"}
{"tipo":"crea_attivita","persona":"id o null","attivita":"chiamata|appuntamento|promemoria","data":"AAAA-MM-GG","ora":"HH:MM o vuoto","testo":"cosa fare, breve"}
{"tipo":"aggiungi_nota","persona":"id","testo":""}
{"tipo":"crea_trattativa","titolo":"","persona":"id o null","settore":"id","importo":0,"fase":"una delle fasi","scadenza":"AAAA-MM-GG o null"}
{"tipo":"aggiorna_trattativa","trattativa":"id","fase":"una delle fasi","importo":null}
Regole: calcola le date relative partendo da oggi. Non inventare dati che l'utente non ha detto. Se un nome non corrisponde a nessuna persona e non è chiaro che vada creato, non creare azioni e chiedi chiarimenti nella risposta. Le risposte alle domande devono essere brevi, in italiano, con un elenco puntato se servono più nomi.`;
}
async function interpret(text){
  if (SAMPLE) {
    try {
      const r = await SAMPLE.json(aiPrompt(text), {modelTier:"quick", cache:false});
      if (r && Array.isArray(r.azioni)) return {...r, motore:"Claude"};
    } catch(e) {
      if (e?.code === "not_granted") { SAMPLE = null; $("#vEngine").textContent = "Interprete locale (Claude non autorizzato)"; }
    }
  }
  return {...localInterpret(text), motore:"interprete locale"};
}

/* risolve riferimenti a persone: id, nome esistente o nome creato nello stesso messaggio */
function resolve(ref, created){
  if (!ref) return null;
  if (P(ref) && seeP(P(ref))) return ref;
  if (created[norm(ref)]) return created[norm(ref)];
  const m = mentions(String(ref)); return m[0]?.id || null;
}
function describe(a, pending){
  const nm = r => { if (!r) return "—"; if (P(r)) return P(r).nome; return pending.has(norm(r)) ? r + " (nuovo)" : r; };
  switch (a.tipo) {
    case "crea_persona": return ["Nuovo contatto", `${a.nome}${a.ruolo?" · "+a.ruolo:""}${a.citta?" · "+a.citta:""}${(a.settori||[]).length?" · "+a.settori.map(s=>Sett(s)?.nome).filter(Boolean).join(", "):""}${a.telefono?" · "+a.telefono:""}${a.email?" · "+a.email:""}`];
    case "aggiorna_persona": return ["Aggiorna scheda", `${nm(a.persona)}: ${Object.entries(a.campi||{}).map(([k,v])=>k+" → "+v).join(", ")}`];
    case "crea_relazione": return ["Collegamento", `${nm(a.da)} — ${TIPI_REL[a.relazione]||a.relazione} — ${nm(a.a)}${a.nota?" · "+a.nota:""}`];
    case "registra_contatto": return [({chiamata:"Chiamata registrata",appuntamento:"Incontro registrato",messaggio:"Messaggio registrato"})[a.canale]||"Contatto registrato", `${nm(a.persona)} · oggi · ${a.testo}`];
    case "crea_attivita": return [TIPI_ATT[a.attivita]||"Promemoria", `${a.testo}${a.persona?" · "+nm(a.persona):""} · ${fmtD(a.data)}${a.ora?" alle "+a.ora:""}`];
    case "aggiungi_nota": return ["Nota", `${nm(a.persona)}: ${a.testo}`];
    case "crea_trattativa": return ["Nuova trattativa", `${a.titolo}${a.persona?" · "+nm(a.persona):""} · ${eur(a.importo)} · ${a.fase||"Contatto"}`];
    case "aggiorna_trattativa": { const t = S.trattative.find(x=>x.id===a.trattativa); return ["Aggiorna trattativa", `${t?.titolo||a.trattativa}${a.fase?" → "+a.fase:""}${a.importo?" · "+eur(a.importo):""}`]; }
  }
  return ["Azione", JSON.stringify(a)];
}
function applyAll(list){
  const created = {}; let n = 0, skipped = 0;
  for (const a of list) {
    const pid = a.persona ? resolve(a.persona, created) : null;
    switch (a.tipo) {
      case "crea_persona": { const p = newPerson({nome:a.nome, tipo:a.tipoScheda==="azienda"?"azienda":"persona", ruolo:a.ruolo||"", azienda:a.azienda||"", settori:(a.settori||[]).filter(Sett), telefono:a.telefono||"", email:a.email||"", citta:a.citta||""}); if (p.settori.length && !isAdmin()) p.visibilita = "settore"; created[norm(a.nome)] = p.id; log(`Creato il contatto ${p.nome}`, "voce"); n++; break; }
      case "aggiorna_persona": { if (!pid) { skipped++; break; } const p = P(pid); const ok = ["telefono","email","citta","ruolo","azienda"]; Object.entries(a.campi||{}).forEach(([k,v]) => { if (ok.includes(k)) p[k] = v; }); log(`Aggiornata la scheda di ${p.nome}`, "voce"); n++; break; }
      case "crea_relazione": { const da = resolve(a.da, created), b = resolve(a.a, created); if (!da || !b || da===b) { skipped++; break; } S.relazioni.push({id:uid("r"), da, a:b, tipo: TIPI_REL[a.relazione] ? a.relazione : "conoscenza", nota:a.nota||"", visibilita:"tutti", creatoDa:ME}); log(`Collegati ${P(da).nome} e ${P(b).nome} (${TIPI_REL[a.relazione]||"conoscenza"})`, "voce"); n++; break; }
      case "registra_contatto": { if (!pid) { skipped++; break; } S.attivita.push({id:uid("a"), tipo:a.canale||"chiamata", personaId:pid, data:TODAY(), ora:new Date().toTimeString().slice(0,5), testo:a.testo, fatto:true, assegnatoA:ME, condivisa:true}); P(pid).ultimoContatto = TODAY(); log(`${TIPI_ATT[a.canale]||"Contatto"} con ${P(pid).nome}: ${a.testo}`, "voce"); n++; break; }
      case "crea_attivita": { S.attivita.push({id:uid("a"), tipo:a.attivita||"promemoria", personaId:pid, data:a.data||addDays(1), ora:a.ora||"", testo:a.testo, fatto:false, assegnatoA:ME, condivisa:true}); log(`${TIPI_ATT[a.attivita]||"Promemoria"}: ${a.testo} (${fmtD(a.data)})`, "voce"); n++; break; }
      case "aggiungi_nota": { if (!pid) { skipped++; break; } S.attivita.push({id:uid("a"), tipo:"nota", personaId:pid, data:TODAY(), ora:"", testo:a.testo, fatto:true, assegnatoA:ME, condivisa:true}); log(`Nota su ${P(pid).nome}: ${a.testo}`, "voce"); n++; break; }
      case "crea_trattativa": { S.trattative.push({id:uid("t"), titolo:a.titolo, personaId:pid, settore:Sett(a.settore)?a.settore:(me().settori[0]||"naut"), fase:FASI.includes(a.fase)?a.fase:"Contatto", importo:+a.importo||0, responsabile:ME, scadenza:a.scadenza||""}); log(`Nuova trattativa: ${a.titolo}`, "voce"); n++; break; }
      case "aggiorna_trattativa": { const t = S.trattative.find(x=>x.id===a.trattativa) || S.trattative.find(x=>norm(x.titolo)===norm(a.trattativa)); if (!t || !seeT(t)) { skipped++; break; } if (FASI.includes(a.fase)) t.fase = a.fase; if (a.importo) t.importo = +a.importo; log(`Trattativa «${t.titolo}»: ${t.fase}`, "voce"); n++; break; }
      default: skipped++;
    }
  }
  save(); render();
  return {n, skipped};
}

/* ================= interfaccia vocale ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, lastResult = null;
const EXAMPLES = [
  "Ho chiamato Giorgio Galli, vuole vedere il Riva sabato. Richiamalo tra 3 giorni",
  "Aggiungi contatto Franco Moretti, broker, settore nautica, telefono 333 9876543",
  "Collega Anna Verdi con Lucia Bianchi, sono amiche",
  "Appuntamento con Chiara Fontana venerdì alle 11",
  "Nuova trattativa per la villa di Cernobbio con Marco Rossi da 1,2 milioni",
  "Chi non sento da 3 mesi?",
  "Chi conosce Marco Rossi nel settore nautica?",
  "Cosa devo fare domani?"
];
function setVState(txt, cls){ const s = $("#vState"); s.textContent = txt; s.className = "pill " + (cls||"neu"); }
function openVoice(startListening){
  $("#voice").hidden = false;
  $("#vEx").innerHTML = EXAMPLES.map(e => `<button type="button">${esc(e)}</button>`).join("");
  $("#vEngine").textContent = SAMPLE ? "Interpretazione con Claude" : "Interprete locale";
  if (startListening) listen(); else $("#vText").focus();
}
function closeVoice(){ stopListen(); $("#voice").hidden = true; $("#fab").focus(); }
function listen(){
  if (!SR) { setVState("microfono non disponibile", "warn"); $("#vOut").innerHTML = `<p class="muted">Questo browser non supporta la dettatura diretta. Su telefono tocca il microfono della tastiera dentro il riquadro, poi premi «Interpreta».</p>`; $("#vText").focus(); return; }
  if (listening) { stopListen(); return; }
  try {
    rec = new SR(); rec.lang = "it-IT"; rec.interimResults = true; rec.continuous = true;
    const base = $("#vText").value ? $("#vText").value.trim() + " " : "";
    let finalTxt = "";
    rec.onresult = e => { let interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalTxt += r[0].transcript + " "; else interim += r[0].transcript; } $("#vText").value = (base + finalTxt + interim).replace(/\s+/g," ").trimStart(); };
    rec.onerror = e => { setVState(e.error === "not-allowed" || e.error === "service-not-allowed" ? "microfono bloccato" : "errore", "warn"); if (e.error === "not-allowed" || e.error === "service-not-allowed") $("#vOut").innerHTML = `<p class="muted">Il microfono non è disponibile in questa pagina. Su telefono usa il microfono della tastiera dentro il riquadro, poi premi «Interpreta». Aprendo il file index.html in Chrome la dettatura diretta funziona.</p>`; };
    rec.onend = () => { listening = false; $("#fab").classList.remove("rec"); $("#vWave").hidden = true; $("#vMic span").textContent = "Parla"; if ($("#vState").textContent === "ascolto…") { setVState("pronto"); if ($("#vText").value.trim()) runInterpret(); } };
    rec.start(); listening = true; $("#fab").classList.add("rec"); $("#vWave").hidden = false; $("#vMic span").textContent = "Stop"; setVState("ascolto…", "bad");
  } catch(e) { setVState("microfono non disponibile", "warn"); }
}
function stopListen(){ try { rec?.stop(); } catch(e){} }
async function runInterpret(){
  const text = $("#vText").value.trim(); if (!text) { $("#vText").focus(); return; }
  setVState("interpreto…", "warn"); $("#vGo").disabled = true;
  $("#vOut").innerHTML = `<p class="muted">${SAMPLE ? "Sto chiedendo a Claude…" : "Sto interpretando…"}</p>`;
  const r = await interpret(text);
  lastResult = r; $("#vGo").disabled = false; setVState("pronto");
  const pending = new Set((r.azioni||[]).filter(a=>a.tipo==="crea_persona").map(a=>norm(a.nome)));
  const props = (r.azioni||[]).map((a,i) => { const [k,d] = describe(a, pending); return `<label class="prop"><input type="checkbox" checked data-i="${i}"><div class="t"><div class="k">${esc(k)}</div><div>${esc(d)}</div></div></label>`; }).join("");
  $("#vOut").innerHTML = `${r.risposta ? `<div class="answer">${esc(r.risposta)}</div>` : ""}
    ${props ? `<h3>Ho capito queste modifiche · controlla e conferma</h3>${props}<div class="row"><button class="btn pri" id="vApply" ${canEdit()?"":"disabled"}>Conferma e salva</button><button class="btn" id="vDiscard">Annulla</button>${canEdit()?"":'<span class="muted">Con il ruolo «Sola lettura» puoi solo fare domande.</span>'}</div>` : (r.risposta ? "" : `<p class="muted">Non ho trovato modifiche da fare.</p>`)}
    <p class="muted" style="font-size:12px">Interpretato con: ${esc(r.motore)}</p>`;
  $("#vApply")?.addEventListener("click", () => {
    const sel = [...$("#vOut").querySelectorAll("[data-i]:checked")].map(c => lastResult.azioni[+c.dataset.i]);
    const {n, skipped} = applyAll(sel);
    $("#vOut").innerHTML = `<div class="answer">Salvate ${n} modifiche${skipped?`, ${skipped} saltate perché la persona non è stata trovata o non è visibile`:""}.</div>`;
    $("#vText").value = ""; toast(`Salvate ${n} modifiche a voce.`);
  });
  $("#vDiscard")?.addEventListener("click", () => { $("#vOut").innerHTML = ""; });
}
$("#fab").onclick = () => { if ($("#voice").hidden) openVoice(true); else listen(); };
$("#vMic").onclick = listen;
$("#vGo").onclick = runInterpret;
$("#vClose").onclick = closeVoice;
$("#vText").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) runInterpret(); });
$("#vEx").onclick = e => { const b = e.target.closest("button"); if (b) { $("#vText").value = b.textContent; runInterpret(); } };

load();
try { const t = localStorage.getItem(KEY+".tab"); if (t && TABS.some(x=>x[0]===t)) TAB = t; } catch(e){}
if (!U(ME)) ME = "u_admin";

function applyTheme(v){
  const r = document.documentElement;
  if (v === "light" || v === "dark") { r.setAttribute("data-theme", v); themeMine = true; }

try { applyTheme(localStorage.getItem(KEY+".tema") || "auto"); } catch(e){ applyTheme("auto"); }
$("#themeSel").onchange = e => { applyTheme(e.target.value); try { localStorage.setItem(KEY+".tema", e.target.value); } catch(err){} };
renderUsers(); setupMap(); go(TAB);
window.addEventListener("resize", () => { if (TAB==="mappa" && !fitted) fit(); });
(async () => { try { const s = await window.claude?.use?.("sample"); if (s) { SAMPLE = s; if (!$("#voice").hidden) $("#vEngine").textContent = "Interpretazione con Claude"; } } catch(e){} })();
window.NCRM = {localInterpret, parseWhen, parseAmount, mentions, applyAll};
